name: Release

# Builds http2midi.exe and publishes it as a GitHub Release when a version tag (e.g. v1.5.0) is pushed
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx eslint .

      - run: npm run build

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/http2midi/config | Out-Null
          Copy-Item dist/http2midi.exe release/http2midi/
          Copy-Item config/server_config.json release/http2midi/config/
          Copy-Item README.md, command_list.md, LICENSE release/http2midi/
          Compress-Archive -Path release/http2midi -DestinationPath "http2midi-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "http2midi-${{ github.ref_name }}-win-x64.zip" --title "${{ github.ref_name }}" --generate-notes
